# ============================================================
# Netlify — despliegue continuo del frontend (app/) desde el repo
# ------------------------------------------------------------
# La app vive en app/ (Vite + React). `base` hace que Netlify instale y
# compile ahí; `publish` (relativo a base) es la carpeta de salida de Vite.
# El redirect /* → /index.html es OBLIGATORIO para una SPA con React Router:
# sin él, refrescar o entrar directo a /cotizador o /catalogo daría 404.
#
# Variables de entorno: las VITE_FIREBASE_* NO son obligatorias (la config de
# Firebase tiene valores por defecto en app/src/lib/firebase.js y son
# públicas). La ÚNICA obligatoria es `BCCR_TOKEN` (token de la API SDDE del
# BCCR), que usa la función app/netlify/functions/tipo-cambio.mjs. Se define en
# la UI de Netlify (Site configuration → Environment variables), con alcance
# que incluya "Functions". NINGÚN secreto (token BCCR / service account) va
# en este archivo ni en el repo.
# ============================================================

[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

# Funciones del lado servidor (ruta relativa a `base`): proxy del tipo de
# cambio del BCCR → /.netlify/functions/tipo-cambio. Las rutas /.netlify/* no
# las intercepta el redirect SPA de abajo.
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: cualquier ruta desconocida sirve index.html (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
